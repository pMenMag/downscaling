[buil-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "downscaling"
version = "0.1.0"
description = "ML downscaling of ERA5 to CERRA resolution over Catalonia"
requires-python = ">=3.11"
dependencies = [   
    "numpy",
    "pandas",
    "xarray",
    "dask",
    "zarr",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
